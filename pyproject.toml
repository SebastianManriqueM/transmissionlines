[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transmissionlines"
version = "0.1.0"
description = "Transmission line parameter models and calculations."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "infrasys",
    "numpy",
    "pandas",
    "pyarrow",
    "pydantic",
    "pyyaml",
    "typer",
]

[project.scripts]
tl = "transmissionlines.cli.app:app"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = ["-ra"]

[tool.coverage.run]
source = ["transmissionlines"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/transmissionlines"]