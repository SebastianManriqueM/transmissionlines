[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transmissionlines"
version = "0.1.0"
description = "Transmission line modeling migration foundation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "infrasys>=1.2.1,<2",
  "numpy>=2",
  "pydantic>=2",
  "pandas>=2",
  "pyarrow>=15",
  "openpyxl>=3.1",
]

[project.scripts]
tl = "transmissionlines.cli.app:app"

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra --cov=transmissionlines --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["transmissionlines"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
src = ["src", "test"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D100", "D101", "D102", "D104", "D204", "E501", "E701", "E702", "F403", "I001", "B905"]

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["transmissionlines"]
warn_unused_ignores = true
warn_return_any = true
disable_error_code = ["prop-decorator", "no-any-return", "import-untyped"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "infrasys.*",
  "pint.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "transmissionlines.units"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true
